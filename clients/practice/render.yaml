# Render Blueprint for client "practice" (the owner's practice deploy).
# In Render: New > Blueprint > this repository > Blueprint Path = clients/practice/render.yaml.
# See docs/setup.md "Deploy a new client".
#
# FREE VERSION (owner decision 2026-11-05: "all free, no Chat for now"):
# - Database, API and web app on Render's free plans. Free web services sleep after
#   about 15 minutes idle (first visit takes about a minute) and the in-process
#   scheduled jobs pause while asleep. The free database is deleted 30 days after
#   creation (14-day grace period), so this is for practice only.
# - No agent service: private services and disks have no free plan. AGENT_SHELL is
#   "0", so Chat, the agent builder and team agents show "Not available on this
#   deployment" instead of queueing work that never runs.
# - Free plans cannot run a pre-deploy command, so the API applies migrations and
#   checks schema drift at start (dockerCommand below) before serving.
# To go paid later: set the plans back to 0.5c-512mb / 0.1c-256mb, restore the
# practice-agent service and preDeployCommand from render.yaml.template, and set
# AGENT_SHELL to "1".
#
# Values typed at the prompts (sync: false): API_URL, APP_URL, ALLOWED_SIGN_IN,
# AUTH_COOKIE_DOMAIN, the sign-in client pair and AI_GATEWAY_API_KEY. API_URL and
# APP_URL must be right before the first build: the web app bakes API_URL into the
# browser bundle. Leave ALLOWED_SIGN_IN, AUTH_COOKIE_DOMAIN and Google blank.

# region must be the same on the database and every service and cannot be changed
# after creation.
databases:
  - name: practice-db
    region: oregon
    plan: free
    postgresMajorVersion: "17"
    ipAllowList: []

envVarGroups:
  - name: practice-shared
    envVars:
      - key: CLIENT_ID
        value: practice
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: AGENT_BRIDGE_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: MCP_ENCRYPTION_KEY
        generateValue: true
      - key: CHAT_EVENT_ENCRYPTION_KEY
        generateValue: true
      # No agent service on the free plan, so the shell features are off and the
      # app says so. Set to "1" when the agent service is added.
      - key: AGENT_SHELL
        value: "0"

services:
  - type: web
    name: practice-api
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    # Free plans have no preDeployCommand: migrate and check drift, then start.
    dockerCommand: sh -c "bun run db:deploy && bun apps/api/scripts/check-schema-drift.mjs && exec bun apps/api/dist/main.js"
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - fromGroup: practice-shared
      - key: DATABASE_URL
        fromDatabase:
          name: practice-db
          property: connectionString
      - key: API_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: AUTH_COOKIE_DOMAIN
        sync: false
      - key: ALLOWED_SIGN_IN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: AI_GATEWAY_API_KEY
        sync: false

  - type: web
    name: practice-app
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./apps/app/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - fromGroup: practice-shared
      - key: DATABASE_URL
        fromDatabase:
          name: practice-db
          property: connectionString
      # CLIENT_ID is also set on the service itself: Render documents that
      # service-level variables become Docker build arguments
      # (https://render.com/docs/docker, "Environment variable translation"), and the
      # web app bakes CLIENT_ID at `next build`.
      - key: CLIENT_ID
        value: practice
      - key: IS_MARKETING
        value: "false"
      - key: API_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: ALLOWED_SIGN_IN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
